# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #

# you can choose themes from $HOME/.config/kitty/kitty-themes/
include ./kitty-themes/00-Default.conf

font_family FantasqueSansM Nerd Font Mono Bold
font_size 16.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.9
dynamic_background_opacity 1
confirm_os_window_close 0

# Animated cursor
cursor_trail 1

# change to x11 or wayland or leave auto
linux_display_server auto

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell no

window_padding_width 4

selection_foreground none
selection_background none

foreground #2d2d2d
background #fffff0
cursor #2d2d2d

# Clipboard: Ctrl+C vuelve al default Unix (SIGINT). Super+C/V/X son atajos
# system-wide capturados por Hyprland (SuperClipboard.sh) que inyectan
# Ctrl+Shift+C/V/X cuando la app activa es kitty. Por eso solo agrego el
# binding de cut, que kitty no trae por default (copy y paste con
# Ctrl+Shift+C/V ya vienen incluidos).
map ctrl+shift+x copy_and_clear_to_clipboard