# User Settings
# This is where you put your own settings as this will not be touched during update 
# if the upgrade.sh is used.

# refer to Hyprland wiki for more info https://wiki.hyprland.org/Configuring/Variables/
# NOTE: some settings are in ~/.config/hypr/UserConfigs/UserDecorAnimations.conf
#
# Look on ~/.config/hypr/configs/SystemSettings.conf to know how to modify this

misc {
  # hyprland-guiutils no está instalado en Ubuntu; deshabilitado para evitar crash al aparecer ventana no responsiva
  enable_anr_dialog = false
  # silenciar el aviso "Your system does not have hyprland-guiutils installed" al iniciar
  disable_hyprland_guiutils_check = true
}

input {
  kb_layout = us,es
}

# Override de configs/SystemSettings.conf (sourceado antes que este archivo):
# desactivar force_zero_scaling para que Hyprland escale las apps XWayland por
# monitor en vez de renderizarlas a 1x (se veían minúsculas en la pantalla Retina).
# Costo: las apps X11 quedan levemente borrosas en HiDPI, pero al tamaño correcto.
xwayland {
  force_zero_scaling = false
}

