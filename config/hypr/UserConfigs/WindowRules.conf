# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# For window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# This file is used to add or overwrite window rules
# This file will not be modified during dotfiles updates

windowrule {
    name = hypr-keybindings
    match:class = ^(hypr-keybindings)$
    float = on
    workspace = 2
    size = 50% 100%
    move = 50% 0%
    pin = on
}

# 2026-07-13: Chromium opaco y sin blur — eficiencia de video. El tag vendor
# `browser` le daba opacity 0.99 y con blur passes=3 + ignore_opacity el
# compositor re-blureaba la región detrás del navegador en cada frame de video.
# Medido con YouTube 1080p H.264 (decode por HW): 23.5W/86.8°C -> 11.1W/69.5°C.
# Este archivo se sourcea DESPUÉS del vendor, así que estas reglas ganan.
# Backup: .bak-20260713
windowrule = match:class ^([Cc]hromium)$, no_blur on
windowrule = match:class ^([Cc]hromium)$, opacity 1.0 1.0
