# Commands and Apps to be executed at launch

# Night shift — restaura el último estado (auto o forzado) en lugar de resetear a auto
exec-once = $HOME/.config/hypr/scripts/Hyprsunset.sh init
exec-once = ulauncher --hide-window

# Teclado — restaura el último layout seleccionado (delay para que Hyprland termine de cargar dispositivos)
exec-once = sleep 3 && $HOME/.config/hypr/scripts/KeyboardLayout.sh restore

# Cerrar Claude Desktop del todo cuando no tiene ventanas (no persistir en tray)
exec-once = $HOME/.config/hypr/scripts/ClaudeDesktopAutoQuit.sh
