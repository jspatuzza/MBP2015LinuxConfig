# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# Hyprlock config for => 2k monitor resolutions
# Original config submitted by https://github.com/SherLock707

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
# Color de fondo y texto según modo claro/oscuro (actualizado por DarkLight.sh)
source = $HOME/.config/hypr/hyprlock-theme.conf
$Scripts = $HOME/.config/hypr/scripts

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
}

background {
    monitor =
    path =
    color = $hyprlock_bg
}

# LABEL
label {
    monitor =
    text = Contraseña
    color = $hyprlock_text
    font_size = 41
    font_family = JetBrainsMono NFM ExtraLight
    position = 0, 80
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 306, 93
    rounding = 6
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = 0
    outer_color = $hyprlock_accent
    inner_color = $hyprlock_inner
    capslock_color = rgb(255,255,255)
    font_color = $hyprlock_text
    fade_on_empty = false
    font_family = JetBrainsMono NFM ExtraLight
    placeholder_text =
    hide_input = false
    position = 0, -30
    halign = center
    valign = center
}
