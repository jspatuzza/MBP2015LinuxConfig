# Commands and Apps to be executed at launch (vendor defaults)
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
$lock = $scriptsDir/LockScreen.sh
$SwwwRandom = $UserScripts/WallpaperAutoChange.sh
$livewallpaper=""
$wallDIR = $HOME/Pictures/wallpapers  # change path manually here if needed

### wallpaper stuff ###
exec-once = swaybg -i $HOME/Imágenes/Wallpaper.jpg -m fill
#exec-once = swww-daemon --format xrgb  # requiere compilación desde fuente

### Startup ###
exec-once = ln -sf /run/user/1000/hypr /tmp/hypr
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = $scriptsDir/Polkit.sh
#exec-once = nm-applet --indicator
exec-once = bash -c 'mode=$(cat "$HOME/.cache/.theme_mode" 2>/dev/null); if [ "$mode" = "Light" ]; then cp "$HOME/.config/mako/config-light" "$HOME/.config/mako/config"; ln -sf "$HOME/.config/waybar/style/[Light] Aurora-Ivory.css" "$HOME/.config/waybar/style.css"; else cp "$HOME/.config/mako/config-dark" "$HOME/.config/mako/config"; ln -sf "$HOME/.config/waybar/style/[Dark] Latte-Wallust combined.css" "$HOME/.config/waybar/style.css"; fi'
exec-once = mako
#exec-once = swaync  # no instalado en Ubuntu
exec-once = env LANG=es_ES.UTF-8 LC_ALL=es_ES.UTF-8 waybar
#exec-once = qs -c overview  # no instalado
exec-once = hypridle

# Config errors → notificación en cada reload
exec = $scriptsDir/CheckConfigErrors.sh

# Clipboard manager
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Rainbow borders (disabled by default; use quick settings menu)
#exec-once = $UserScripts/RainbowBorders.sh


