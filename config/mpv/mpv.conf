# mpv.conf — 2026-07-13 — YouTube/video web forzado a H.264 (avc1) en el MBP12,1
# Broadwell decodifica H.264 por hardware (VA-API); VP9/AV1 irían por CPU.

# Video: solo H.264 hasta 1080p; el /best final evita quedarse sin reproducción
# en el raro caso de un video sin avc1 (YouTube no codifica 1440p/4K en H.264:
# el techo con este filtro es 1080p, igual que con enhanced-h264ify).
ytdl-format=bestvideo[vcodec^=avc1][height<=?1080]+bestaudio/best[vcodec^=avc1]/best

# Decodificación por hardware (iHD/VA-API) y salida Wayland nativa
hwdec=vaapi
vo=gpu
gpu-context=wayland

# Escalado barato: los scalers default de mpv saturaban el render de la Iris 6100
# (RCS 59%, 6.2W midiendo 1080p60). A 1080p en 13" la diferencia es invisible.
# Si algún día se ve mal, comentar esta línea.
profile=fast

# yt-dlp instalado vía pipx (ruta determinística, independiente del PATH de la sesión)
script-opts=ytdl_hook-ytdl_path=/home/jspatuzza/.local/bin/yt-dlp

# Subtítulos de YouTube (manuales + automáticos). Si el arranque se siente
# lento, comentar esta línea.
ytdl-raw-options=sub-langs="es.*,en.*",write-subs=,write-auto-subs=

# Calidad de vida
keep-open=yes
save-position-on-quit=yes
osc=yes
