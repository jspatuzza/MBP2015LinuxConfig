# /etc/tlp.d/50-mbp2015.conf — MacBook Pro 12,1 (early 2015) · Ubuntu 24.04
# Política: AC = máximo rendimiento · Batería = máxima autonomía.
# Espejo en ~/Main/JSpatuzza/MBP2015LinuxConfig/system/etc/tlp.d/
#
# Notas de hardware (auditoría 2026-07-05):
#  - i5-5257U Broadwell SIN HWP: no existe EPP; el knob real es EPB
#    (energy_perf_bias 0-15), que TLP maneja vía CPU_ENERGY_PERF_POLICY_*.
#  - intel_pstate corre en modo PASSIVE (default del kernel para CPUs sin HWP).
#    NUNCA usar governor "powersave" en este modo: clava la CPU a 500 MHz fijos.
#  - No existe /sys/firmware/acpi/platform_profile → PLATFORM_PROFILE_* no aplica.
#  - applesmc no expone umbrales de carga → START/STOP_CHARGE_THRESH_* no aplica.
#  - SSD Kingston NV2 (NVMe aftermarket, sin ASPM en su link; ahorra vía APST).
#    No hay ningún host SATA/AHCI → SATA_LINKPWR/AHCI_* no aplican.
#  - Requiere power-profiles-daemon enmascarado (systemctl mask) para que no
#    pise EPB/no_turbo (su unit declara Conflicts=tlp.service).

# --- CPU ---
CPU_DRIVER_OPMODE_ON_AC=passive
CPU_DRIVER_OPMODE_ON_BAT=passive
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_GOVERNOR_ON_BAT=schedutil
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power
# Sin turbo a batería: pico 2.7 GHz (base). El tramo turbo 2.7→3.1 GHz es el
# mayor consumidor bajo carga en este 28W. Compilaciones a batería serán más lentas.
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0
CPU_MIN_PERF_ON_AC=0
CPU_MAX_PERF_ON_AC=100
CPU_MIN_PERF_ON_BAT=0
CPU_MAX_PERF_ON_BAT=100

# --- GPU Intel Iris 6100 (valores reales del hardware: RPn=300, RP0=1050 MHz) ---
INTEL_GPU_MIN_FREQ_ON_AC=300
INTEL_GPU_MIN_FREQ_ON_BAT=300
INTEL_GPU_MAX_FREQ_ON_AC=1050
INTEL_GPU_BOOST_FREQ_ON_AC=1050
# Si hay animaciones trabadas en Hyprland a batería, subir ambos a 900-1050
# (el costo en idle es nulo, manda el mínimo).
INTEL_GPU_MAX_FREQ_ON_BAT=800
INTEL_GPU_BOOST_FREQ_ON_BAT=800

# --- PCIe / Runtime PM ---
PCIE_ASPM_ON_AC=default
# powersave (no powersupersave): brcmfmac BCM43602 y el NVMe aftermarket son
# candidatos típicos a colgarse con L1 substates. Escalar solo tras validar dmesg.
PCIE_ASPM_ON_BAT=powersave
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto
# facetimehd (cámara, driver DKMS) no implementa runtime PM: si se suspende
# queda muerta hasta reboot. mei_me viene excluido por default de TLP.
RUNTIME_PM_DRIVER_DENYLIST="mei_me facetimehd"
# Plan B si aparecen errores NVMe en dmesg tras idle a batería:
# RUNTIME_PM_DENYLIST="04:00.0"

# --- Disco (NVMe puro) ---
DISK_DEVICES="nvme0n1"
MAX_LOST_WORK_SECS_ON_AC=15
# 60s agrupa writebacks y deja al NVMe en estados APST profundos.
# Trade-off: hasta 60s de trabajo sin flushear ante un corte abrupto.
MAX_LOST_WORK_SECS_ON_BAT=60
DISK_IDLE_SECS_ON_AC=0
DISK_IDLE_SECS_ON_BAT=2

# --- WiFi ---
# Requiere el override de NetworkManager zz-tlp-owns-wifi-powersave.conf
# (wifi.powersave=1 "ignore"); sin él, NM re-aplica power save en cada
# reconexión y anula silenciosamente el valor de AC.
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# --- USB ---
USB_AUTOSUSPEND=1
# 05ac:0273 = teclado/trackpad interno (es USB en el MBP12,1): jamás autosuspender.
# Si el lector SD (esperado 05ac:8406) da errores de I/O con tarjeta puesta, agregarlo.
USB_DENYLIST="05ac:0273"
# El BT (05ac:8290) ya autosuspende hoy sin problemas y no hay periféricos BT
# emparejados. Si se emparejan mouse/auriculares BT y hay cortes, pasar a 1.
USB_EXCLUDE_BTUSB=0
USB_EXCLUDE_AUDIO=1
USB_EXCLUDE_PRINTER=1

# --- Audio (codec Cirrus CS4208) ---
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y

# --- Radios ---
# Sin periféricos BT emparejados en la historia del equipo: apagar la radio BT
# al pasar a batería si no está en uso, y re-encenderla al volver a AC.
# Quitar ambas líneas si se empieza a usar BT.
DEVICES_TO_DISABLE_ON_BAT_NOT_IN_USE="bluetooth"
DEVICES_TO_ENABLE_ON_AC="bluetooth"
