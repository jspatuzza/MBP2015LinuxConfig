# 60-cpu-balanced-ac.conf - 2026-07-13 - perfil balanceado en AC (optimización eficiencia)
# Revertir: sudo rm /etc/tlp.d/60-cpu-balanced-ac.conf && sudo tlp start
# Mantiene CPU_DRIVER_OPMODE_ON_AC=passive de 50-mbp2015.conf.
