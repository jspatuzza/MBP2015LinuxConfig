# TLP es el dueño del power save del WiFi (WIFI_PWR_ON_AC/BAT en
# /etc/tlp.d/50-mbp2015.conf). Sin este override, el default de Ubuntu
# (default-wifi-powersave-on.conf, wifi.powersave=3) se re-aplica en CADA
# reconexión y pisa el valor que puso TLP.
# 1 = ignore: NetworkManager no toca el setting.
[connection]
wifi.powersave = 1
