# Tunables para swap-en-RAM (zram) — ver /etc/systemd/zram-generator.conf
# page-cluster=0: sin readahead (solo útil en disco rotacional)
# swappiness alto: comprimir anon frío es más barato que tirar page cache
# (si se percibe thrashing de CPU, bajar a 100)
vm.swappiness = 180
vm.page-cluster = 0
