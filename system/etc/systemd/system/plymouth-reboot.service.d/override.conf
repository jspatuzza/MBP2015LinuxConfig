# Ver plymouth-poweroff.service.d/override.conf — misma fix para el camino reboot.
[Service]
ExecStartPre=-/usr/local/bin/plymouth-shutdown-start reboot
ExecStartPost=
ExecStartPost=-/usr/bin/plymouth change-mode --reboot
ExecStartPost=-/usr/bin/plymouth reload
ExecStartPost=-/usr/bin/plymouth show-splash
