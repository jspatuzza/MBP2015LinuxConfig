# Ver plymouth-poweroff.service.d/override.conf — mismo helper idempotente
# para el camino reboot. El helper arranca plymouthd como shutdown y luego
# aplica change-mode --reboot (el theme mapea ambos al mismo PNG).
[Service]
Type=oneshot
ExecStartPre=
ExecStart=
ExecStart=/usr/local/bin/plymouth-shutdown-start reboot
ExecStartPost=
