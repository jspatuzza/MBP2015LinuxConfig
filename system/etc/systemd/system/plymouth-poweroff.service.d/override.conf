# Reemplazar el ExecStart original del unit (que arranca plymouthd nuevo con
# --attach-to-session) por el helper idempotente. Si el helper ya corrió
# desde ConfirmAction.sh, esta segunda invocación sale early (flag file en
# /run/plymouth/.applied-mode) — eso evita reload doble y el flicker
# "Iniciando" residual en el medio del shutdown.
[Service]
Type=oneshot
ExecStartPre=
ExecStart=
ExecStart=/usr/local/bin/plymouth-shutdown-start shutdown
ExecStartPost=
