# Fuerza al plymouthd existente (sobreviviente del boot, no muerto por GDM)
# a cambiar de modo y re-ejecutar el script. Sin esto se ve "Iniciando" durante
# uno o dos segundos antes de "Apagando" porque el daemon arrastra el modo boot.
[Service]
ExecStartPost=
ExecStartPost=-/usr/bin/plymouth change-mode --shutdown
ExecStartPost=-/usr/bin/plymouth reload
ExecStartPost=-/usr/bin/plymouth show-splash
