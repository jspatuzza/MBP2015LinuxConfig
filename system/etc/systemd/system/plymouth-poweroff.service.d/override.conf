# Garantiza que haya un plymouthd vivo en modo shutdown ANTES de que el
# ExecStart del servicio (Type=forking, ~170-700ms hasta primer frame)
# arranque el suyo. Sin esto, durante esa ventana queda visible el frame
# residual "Iniciando" que GDM dejo en framebuffer al matar plymouthd con
# --retain-splash. El script maneja los dos casos: daemon vivo (change-mode)
# y daemon muerto (arrancar uno nuevo).
[Service]
ExecStartPre=-/usr/local/bin/plymouth-shutdown-start shutdown
ExecStartPost=
ExecStartPost=-/usr/bin/plymouth change-mode --shutdown
ExecStartPost=-/usr/bin/plymouth reload
ExecStartPost=-/usr/bin/plymouth show-splash
