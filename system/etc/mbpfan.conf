# /etc/mbpfan.conf — 2026-07-13 (v2) — curva MBP12,1 (backup original: .bak-20260713)
# Idle silencioso: por debajo de 62 °C el fan va al mínimo (el idle natural con
# schedutil es 60-67 °C). Rampa desde 68 °C y máximo (6199 rpm) a 80 °C, antes
# del límite de 90 pedido. Carga sintética 4 hilos turbo (23 W) igual toca 95 °C
# en segundos: límite físico del chasis (ver mantenimiento en informe).
# Rescate si el daemon muere sucio: echo 0 | sudo tee /sys/devices/platform/applesmc.768/fan1_manual
[general]
min_fan1_speed = 2000
max_fan1_speed = 6199
low_temp = 62
high_temp = 68
max_temp = 80
polling_interval = 2
